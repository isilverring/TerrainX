name: Validate TerrainX
on: [push, pull_request, workflow_dispatch]
jobs:
  science-and-static-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-lock.txt
      - run: python scripts/validate_results.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm run test:unit
      - run: npm run build
      - name: Install Chromium for production browser checks
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Test the static production application
        run: npm test
        env:
          TERRAINX_BASE_URL: http://127.0.0.1:4173
          TERRAINX_BROWSER_CHANNEL: chromium
          TERRAINX_OFFLINE: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: artifacts/qa/test-results
